<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foto 18 Ludo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: block;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Stile Intestazione fedele a eventi eleganti/diciottesimi */
        .header {
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f39c12; /* Colore Oro/Ambra */
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .main-container {
            max-width: 400px;
            margin: 0 auto;
        }

        .instruction {
            font-size: 20px;
            margin-bottom: 25px;
            font-weight: 300;
            color: #e0e0e0;
        }

        /* Grande tasto + per selezione */
        .upload-label {
            display: inline-block;
            width: 120px;
            height: 120px;
            line-height: 110px;
            border-radius: 50%;
            border: 3px dashed #f39c12;
            font-size: 60px;
            color: #f39c12;
            cursor: pointer;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            background: rgba(243, 156, 18, 0.05);
        }

        .upload-label:active {
            transform: scale(0.95);
            background: rgba(243, 156, 18, 0.2);
        }

        #file-input {
            display: none;
        }

        /* Griglia delle Anteprime */
        .preview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        .preview-item {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Snap 1:1 Aspect Ratio */
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .preview-item img, .preview-item video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Pulsante Invia */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #f39c12, #d35400);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            display: none; /* Visibile solo se ci sono file */
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Stato di Caricamento o Successo */
        .status-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 13, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .status-box {
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-icon {
            font-size: 60px;
            color: #2ecc71;
            margin-bottom: 20px;
        }

        .status-text {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1>FOTO 18 LUDO</h1>
            <p>Condividi i tuoi momenti</p>
        </div>

        <p class="instruction">Carica qui le tue foto e video</p>

        <label for="file-input" class="upload-label">+</label>
        <input type="file" id="file-input" accept="image/*,video/*" multiple capture="environment">

        <div class="preview-container" id="preview-container"></div>

        <button class="btn-submit" id="submit-btn" onclick="uploadFiles()">Invia</button>
    </div>

    <div class="status-overlay" id="status-overlay">
        <div class="status-box" id="status-box">
            </div>
    </div>

    <script>
        // INSERISCI QUI L'URL COPIATO DA GOOGLE APPS SCRIPT (punto 11)
        https://script.google.com/macros/s/AKfycbznQKcxoyuOP8JeCDm7GmOrox6S2wvreMvd3vM9i0U/dev

        let selectedFiles = [];

        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const submitBtn = document.getElementById('submit-btn');
        const statusOverlay = document.getElementById('status-overlay');
        const statusBox = document.getElementById('status-box');

        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            selectedFiles = selectedFiles.concat(files);
            renderPreviews();
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            if (selectedFiles.length > 0) {
                submitBtn.style.display = 'block';
            } else {
                submitBtn.style.display = 'none';
            }

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';

                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    reader.onload = function(e) { img.src = e.target.result; }
                    reader.readAsDataURL(file);
                    previewItem.appendChild(img);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.muted = true;
                    reader.onload = function(e) { video.src = e.target.result; }
                    reader.readAsDataURL(file);
                    previewItem.appendChild(video);
                }
                previewContainer.appendChild(previewItem);
            });
        }

        async function uploadFiles() {
            if (selectedFiles.length === 0) return;

            // Mostra overlay di caricamento
            statusOverlay.style.display = 'flex';
            statusBox.innerHTML = `
                <div class="spinner"></div>
                <div class="status-text">Caricamento in corso...<br><span id="progress-text">0/${selectedFiles.length}</span></div>
            `;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                document.getElementById('progress-text').innerText = `${i + 1}/${selectedFiles.length}`;

                try {
                    const base64Data = await fileToBase64(file);
                    const payload = {
                        filename: file.name,
                        mimeType: file.type,
                        base64: base64Data.split(',')[1]
                    };

                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors', // Necessario per le limitazioni CORS di Apps Script
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (error) {
                    console.error("Errore durante il caricamento del file:", file.name, error);
                }
            }

            // Mostra messaggio di successo finale
            statusBox.innerHTML = `
                <div class="success-icon">✓</div>
                <div class="status-text">Caricamento avvenuto con successo</div>
            `;
            
            // Resetta lo stato del form dopo 3 secondi
            setTimeout(() => {
                statusOverlay.style.display = 'none';
                selectedFiles = [];
                renderPreviews();
            }, 3000);
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
