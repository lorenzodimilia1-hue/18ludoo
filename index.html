<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludovica 18 Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Sfondo chiaro con una texture leggera che ricorda la carta dell'invito */
            background-color: #fdfbf7;
            background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0);
            background-size: 4px 4px;
            color: #2c3e50;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorazioni floreali stilizzate agli angoli (ispirate all'invito) */
        .corner-decor {
            position: fixed;
            width: 130px;
            height: 130px;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }
        .top-right { top: 0; right: 0; transform: rotate(0deg); }
        .bottom-left { bottom: 0; left: 0; transform: rotate(180deg); }

        .main-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 40px 25px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            border: 1px solid rgba(166, 25, 46, 0.1);
            box-shadow: 0 10px 30px rgba(166, 25, 46, 0.03);
        }

        /* Stile Titolo "Ludovica 18 Birthday" fedele all'invito */
        .header h1 {
            font-family: 'Alex Brush', cursive;
            font-size: 52px;
            color: #a6192e; /* Rosso Borgogna/Carminio dell'invito */
            line-height: 1.1;
            font-weight: 400;
        }

        .header .subtitle {
            font-size: 26px;
            font-family: 'Alex Brush', cursive;
            color: #a6192e;
            margin-top: -5px;
            margin-bottom: 5px;
        }

        .header .event-tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #cb997e; /* Tonalità rosa antico/pesca */
            font-weight: 600;
            margin-bottom: 35px;
        }

        .instruction {
            font-size: 15px;
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #5c677d;
            font-weight: 400;
            text-transform: uppercase;
        }

        /* Grande tasto "+" per selezione, cerchio sottile color rosa antico */
        .upload-label {
            display: inline-block;
            width: 100px;
            height: 100px;
            line-height: 92px;
            border-radius: 50%;
            border: 1px solid #cb997e;
            font-size: 40px;
            color: #cb997e;
            cursor: pointer;
            margin-bottom: 35px;
            background-color: rgba(251, 234, 235, 0.5);
            transition: transform 0.2s, background-color 0.2s;
        }

        .upload-label:active {
            transform: scale(0.96);
            background-color: rgba(251, 234, 235, 0.9);
        }

        #file-input {
            display: none;
        }

        /* Griglia delle Anteprime */
        .preview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            max-height: 220px;
            overflow-y: auto;
            padding: 5px;
        }

        .preview-item {
            position: relative;
            width: 100%;
            padding-top: 100%; 
            background-color: #f5f5f5;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(203, 153, 126, 0.2);
        }

        .preview-item img, .preview-item video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Pulsante Invia Elegante in Rosso Borgogna */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #a6192e;
            color: #ffffff;
            border: none;
            border-radius: 4px; /* Linee più pulite ed eleganti */
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:disabled {
            background-color: #d9c3c5;
            color: #ffffff;
            cursor: not-allowed;
        }

        .btn-submit:not(:disabled):active {
            background-color: #821020;
        }

        /* Schermata di caricamento e successo coerente con lo stile */
        .status-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 251, 247, 0.98);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .status-box {
            text-align: center;
            color: #2c3e50;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(166, 25, 46, 0.1);
            border-top: 3px solid #a6192e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-icon {
            font-size: 55px;
            color: #cb997e;
            font-family: 'Alex Brush', cursive;
            margin-bottom: 15px;
        }

        .status-text {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #a6192e;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <svg class="corner-decor top-right" viewBox="0 0 100 100" fill="none" stroke="#a6192e" stroke-width="0.5">
        <path d="M100,0 C80,10 60,5 50,25 C45,35 50,50 40,60 C30,70 10,65 0,100 M100,20 C85,25 80,40 70,45 M80,0 C75,15 60,20 55,35" />
        <circle cx="65" cy="25" r="3" fill="#cb997e" opacity="0.5"/>
        <circle cx="45" cy="45" r="2" fill="#cb997e" opacity="0.5"/>
    </svg>
    <svg class="corner-decor bottom-left" viewBox="0 0 100 100" fill="none" stroke="#a6192e" stroke-width="0.5">
        <path d="M100,0 C80,10 60,5 50,25 C45,35 50,50 40,60 C30,70 10,65 0,100 M100,20 C85,25 80,40 70,45 M80,0 C75,15 60,20 55,35" />
        <circle cx="65" cy="25" r="3" fill="#cb997e" opacity="0.5"/>
        <circle cx="45" cy="45" r="2" fill="#cb997e" opacity="0.5"/>
    </svg>

    <div class="main-container">
        <div class="header">
            <h1>Ludovica</h1>
            <div class="subtitle">18 Birthday</div>
            <div class="event-tag">29 Giugno 2026</div>
        </div>

        <p class="instruction">Carica qui le tue foto e video</p>

        <label for="file-input" class="upload-label">+</label>
        <input type="file" id="file-input" accept="image/*,video/*" multiple>

        <div class="preview-container" id="preview-container"></div>

        <button class="btn-submit" id="submit-btn" onclick="uploadFiles()" disabled>Invia</button>
    </div>

    <div class="status-overlay" id="status-overlay">
        <div class="status-box" id="status-box"></div>
    </div>

    <script>
        // INSERISCI QUI IL TUO URL WEB APP CHE FINISCE IN /exec
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyrCI0o64XT8PoROUN3XxGbn70xFvfUS3I2owubS5WUNU14NXcwV87r-FYV55KqxT6b/exec";

        let selectedFiles = [];

        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const submitBtn = document.getElementById('submit-btn');
        const statusOverlay = document.getElementById('status-overlay');
        const statusBox = document.getElementById('status-box');

        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                selectedFiles = selectedFiles.concat(files);
                renderPreviews();
            }
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            submitBtn.disabled = selectedFiles.length === 0;

            selectedFiles.forEach((file) => {
                const reader = new FileReader();
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';

                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    reader.onload = function(e) { img.src = e.target.result; }
                    reader.readAsDataURL(file);
                    previewItem.appendChild(img);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.muted = true;
                    reader.onload = function(e) { video.src = e.target.result; }
                    reader.readAsDataURL(file);
                    previewItem.appendChild(video);
                }
                previewContainer.appendChild(previewItem);
            });
        }

        async function uploadFiles() {
            if (selectedFiles.length === 0) return;

            statusOverlay.style.display = 'flex';
            statusBox.innerHTML = `
                <div class="spinner"></div>
                <div class="status-text" style="color: #2c3e50;">Invio in corso...<br><span id="progress-text" style="color: #cb997e; font-weight:600;">0/${selectedFiles.length}</span></div>
            `;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                document.getElementById('progress-text').innerText = `${i + 1}/${selectedFiles.length}`;

                try {
                    const base64Data = await fileToBase64(file);
                    const payload = {
                        filename: file.name,
                        mimeType: file.type,
                        base64: base64Data.split(',')[1]
                    };

                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                } catch (error) {
                    console.error("Errore invio file:", error);
                }
            }

            // Messaggio di successo in stile elegante
            statusBox.innerHTML = `
                <div class="success-icon">Grazie</div>
                <div class="status-text">Caricamento avvenuto con successo</div>
            `;
            
            setTimeout(() => {
                statusOverlay.style.display = 'none';
                selectedFiles = [];
                fileInput.value = '';
                renderPreviews();
            }, 3000);
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
