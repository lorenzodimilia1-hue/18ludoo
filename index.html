<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foto 18 Ludo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #212529;
            display: block;
            min-height: 100vh;
            padding: 30px 20px;
            text-align: center;
        }

        .main-container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .header {
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #2c3e50;
            font-weight: 800;
        }

        .header .line {
            width: 50px;
            height: 3px;
            background-color: #3498db;
            margin: 10px auto;
            border-radius: 2px;
        }

        .instruction {
            font-size: 18px;
            margin-bottom: 30px;
            color: #7f8c8d;
            font-weight: 400;
        }

        .upload-label {
            display: inline-block;
            width: 110px;
            height: 110px;
            line-height: 100px;
            border-radius: 50%;
            border: 2px solid #3498db;
            font-size: 50px;
            color: #3498db;
            cursor: pointer;
            margin-bottom: 30px;
            background-color: #f0f7fc;
            transition: transform 0.2s;
        }

        .upload-label:active {
            transform: scale(0.95);
        }

        #file-input {
            display: none;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            max-height: 240px;
            overflow-y: auto;
            padding: 5px;
        }

        .preview-item {
            position: relative;
            width: 100%;
            padding-top: 100%; 
            background-color: #eaeded;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-item img, .preview-item video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .status-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .status-box {
            text-align: center;
            color: #2c3e50;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-icon {
            font-size: 64px;
            color: #2ecc71;
            margin-bottom: 20px;
        }

        .status-text {
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1>FOTO 18 LUDO</h1>
            <div class="line"></div>
        </div>

        <p class="instruction">Carica qui le tue foto</p>

        <label for="file-input" class="upload-label">+</label>
        <input type="file" id="file-input" accept="image/*,video/*" multiple>

        <div class="preview-container" id="preview-container"></div>

        <button class="btn-submit" id="submit-btn" onclick="uploadFiles()" disabled>Invia</button>
    </div>

    <div class="status-overlay" id="status-overlay">
        <div class="status-box" id="status-box"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbztOSl8QlOVjZuS8APg98Zzrb8IIv4yw1tz9CpI2svhxemny8BsuQYqbAZdp4g-NGw1/exec";

        let selectedFiles = [];

        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const submitBtn = document.getElementById('submit-btn');
        const statusOverlay = document.getElementById('status-overlay');
        const statusBox = document.getElementById('status-box');

        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                selectedFiles = selectedFiles.concat(files);
                renderPreviews();
            }
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            submitBtn.disabled = selectedFiles.length === 0;

            selectedFiles.forEach((file) => {
                const reader = new FileReader();
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';

                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    reader.onload = function(e) { img.src = e.target.result; }
                    reader.readAsDataURL(file);
                    previewItem.appendChild(img);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.muted = true;
                    reader.onload = function(e) { video.src = e.target.result; }
                    reader.readAsDataURL(file);
                    previewItem.appendChild(video);
                }
                previewContainer.appendChild(previewItem);
            });
        }

        async function uploadFiles() {
            if (selectedFiles.length === 0) return;

            statusOverlay.style.display = 'flex';
            statusBox.innerHTML = `
                <div class="spinner"></div>
                <div class="status-text">Caricamento in corso...<br><span id="progress-text">0/${selectedFiles.length}</span></div>
            `;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                document.getElementById('progress-text').innerText = `${i + 1}/${selectedFiles.length}`;

                try {
                    const base64Data = await fileToBase64(file);
                    const payload = {
                        filename: file.name,
                        mimeType: file.type,
                        base64: base64Data.split(',')[1]
                    };

                    // NOTA: Usiamo 'text/plain' per bypassare i controlli CORS restrittivi dei telefoni
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                } catch (error) {
                    console.error("Errore invio:", error);
                }
            }

            statusBox.innerHTML = `
                <div class="success-icon">✓</div>
                <div class="status-text">Caricamento avvenuto con successo</div>
            `;
            
            setTimeout(() => {
                statusOverlay.style.display = 'none';
                selectedFiles = [];
                fileInput.value = '';
                renderPreviews();
            }, 3000);
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
